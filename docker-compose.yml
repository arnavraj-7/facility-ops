# Redis is the ONLY containerised dependency in this project.
#
# Everything else runs natively:
#   - MongoDB  → MongoDB Atlas (managed, connection string in backend/.env)
#   - backend  → npm run dev  (Node)
#   - frontend → npm run dev  (Vite)
#   - AI       → uvicorn      (optional, only when AI_ENABLED=true)
#
#   docker compose up -d redis     # start it
#   docker compose down            # stop it
#
# Redis itself is optional too: if it is not running, the backend logs a
# warning and falls back to an in-memory session store, so the app still works.
services:
  redis:
    image: redis:7-alpine
    container_name: facility-ops-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
